[project]
name = "repopilot"
version = "0.1.0"
description = "A repository-analysis agent built while learning the OpenAI Agents SDK."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai-agents>=0.22.0,<0.23.0",
]

[project.scripts]
repopilot = "repopilot.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<2.0",
]

[tool.uv.sources]
openai-agents = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
